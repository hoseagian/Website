<html>
    <head>
        <title>Website Saya</title>
        <style>
            .box {
                background-color: rgb(0, 128, 255);
            }
            .grid-container {
                display: grid;
                grid-template-columns: 200px 200px 200px 200px;
                grid-template-rows: 200px 200px 200px 200px;
                gap: 1em;
                grid-template-areas:
                "box-1 box-1 box-2 box-3"
                "box-1 box-1 box-4 box-5";
                justify-content: center;
                align-content: center;
            }

            @media (max-width: 56em) {
                .grid-container{
                    grid-template-columns: 200px 200px 200px;
                    grid-template-rows: 200px 200px 200px;
                    grid-template-areas:
                    "box-1 box-1 box-2"
                    "box-1 box-1 box-3"
                    "box-4 box-5 box-5";
                }
            }
            
            body {
                /* min-height: 100dvh;
                display: flex;
                align-items: center;  
                justify-content: center;
                padding: 2%; */
            }
        </style>
    </head>
    <body>
        <h1>Website Saya</h1>
        <div class="grid-container">
            <div class="box" style="grid-area: box-1;">Item 1</div>
            <div class="box" style="grid-area: box-2;">Item 2</div>
            <div class="box" style="grid-area: box-3;">Item 3</div>
            <div class="box" style="grid-area: box-4;">Item 4</div>
            <div class="box" style="grid-area: box-5;">Item 5</div>

</html>
